[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kornet-research"
version = "0.1.0"
description = "Kaprekar-Inspired Recursive Opposing-Ranking Network for visual anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "tensorboard>=2.14",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "plotly>=5.18"]
research = ["optuna>=3.5", "thop>=0.1.1", "wandb>=0.16"]
export = ["onnx>=1.15", "onnxruntime>=1.16", "onnxscript>=0.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3"]

[tool.setuptools]
packages = ["datasets", "models", "losses", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
