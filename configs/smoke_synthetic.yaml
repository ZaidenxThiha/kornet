experiment_name: smoke_synthetic
seed: 7
output_dir: runs
dataset:
  name: mvtec
  root: data/synthetic_mvtec
  category: widget
  image_size: 64
  val_fraction: 0.25
  num_workers: 0
model:
  variant: kornet_adaptive
  backbone: resnet18
  pretrained: false
  feature_dim: 16
  rank_heads: 2
  sort_mode: soft
  sort_temperature: 0.2
  max_tokens: 24
  max_iterations: 3
  train_iterations: 2
  min_iterations: 1
  adaptive_stop: true
  convergence_threshold: 0.01
  convergence_patience: 1
  dropout: 0.0
  multi_scale: true
  ranking: learned
  opposing_subtraction: true
  score_weights: [1.0, 0.2, 0.1]
training:
  epochs: 1
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 0
  mixed_precision: false
  gradient_clip: 1.0
  early_stopping_patience: 2
  checkpoint_metric: val_proxy_score
  fixed_iterations_until_epoch: 0
  wandb: false
  resume: null
loss: {compactness: 1.0, convergence: 0.05, stability: 0.05, variance: 0.01}
evaluation: {threshold_source: validation, sort_mode: hard, adaptive: false, gaussian_sigma: 0.0}
